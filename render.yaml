# Déploiement « Blueprint » Render : un seul clic une fois ce dossier poussé sur GitHub.
services:
  - type: web
    name: northskye-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Adresse de la base PostgreSQL gratuite (Neon ou Supabase) : voir DEPLOIEMENT.md, section « Classement en ligne ».
      - key: DATABASE_URL
        sync: false
